<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body{
            background-color: aliceblue;
            font-family: Verdana;
            padding: 30px 15px;
        }

        h1{
            text-align: center;
            color: crimson;
        }
    
        .hobby-card{
            text-align: center;
            border: 2px solid crimson;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: aliceblue;
        }

        .hobby-card h3 {
            color: crimson;
        }
    </style>

</head>

<body>
    <h1>My Hobby Cards</h1>


    <div class="container">
        <div class="row">
            <div class="col-sm-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Drawing</h3>
                    <p>I love sketching animals and comic characters.</p>
                </div>
            </div>

            <div class="col-sm-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Sport</h3>
                    <p>I love playing Muay Thai.</p>
                </div>
            </div>

            <div class="col-sm-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Reading</h3>
                    <p>I love reading comics and horror stories.</p>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
